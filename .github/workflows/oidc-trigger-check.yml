name: oidc-trigger-check

# ADM-121, ADR-0010. This repository gets CI credentials from the linkt
# broker over GitHub OIDC. No workflow here may grant id-token write on
# pull_request_target, workflow_run, issue_comment, issues, discussion, or
# discussion_comment. This job fails when one does.

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  adr-0010:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: linkt-ai/admin-infra/.github/actions/oidc-trigger-check@0c0d7b72178a4eaed08966fdcf4a1b714092f8c8 # admin-infra main
